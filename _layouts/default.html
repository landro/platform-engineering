<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="site-header">
    <div class="container">
      <nav class="site-nav" aria-label="Site navigation">
        <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="Platform Engineering Manifesto — Home">
          <span class="logo-icon" aria-hidden="true">⚙</span>
          <span class="logo-text">Platform Engineering Manifesto</span>
        </a>
        <div class="nav-links">
          <div id="site-search" class="site-search" data-index-url="{{ '/search.json' | relative_url }}">
            <label for="site-search-input" class="visually-hidden">Search the manifesto</label>
            <svg class="site-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input
              id="site-search-input"
              type="search"
              class="site-search-input"
              placeholder="Search principles…"
              autocomplete="off"
              aria-controls="site-search-results"
              aria-expanded="false" />
            <ul id="site-search-results" class="site-search-results" hidden></ul>
          </div>
          <a href="{{ '/checklist' | relative_url }}" class="nav-link checklist-link">
            <svg height="20" width="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><polyline points="9 14 11 16 15 12"/></svg>
            Checklist
          </a>
          <a href="https://github.com/landro/platform-engineering" class="nav-link github-link" target="_blank" rel="noopener">
            <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            GitHub
          </a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main-content" class="site-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>The Platform Engineering Manifesto &mdash; Inspired by the <a href="https://agilemanifesto.org/" target="_blank" rel="noopener">Agile Manifesto</a>.</p>
      <p><a href="{{ '/' | relative_url }}">Home</a> &middot; <a href="https://github.com/landro/platform-engineering" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body>
</html>
