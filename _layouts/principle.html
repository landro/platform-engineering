---
layout: default
---
<div class="principle-page">
  <div class="container">
    <a href="{{ '/' | relative_url }}" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Manifesto
    </a>
    <article class="principle-content">
      {{ content }}
      {% if page.examples %}
      <ol>
        {% for example in page.examples %}
        <li id="example-{{ forloop.index }}">
          <strong>{{ example.title }}</strong> &mdash; {{ example.body | markdownify | remove: '<p>' | remove: '</p>' | strip }}
          <a href="#example-{{ forloop.index }}" class="example-anchor" aria-label="Permalink to example {{ forloop.index }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </a>
        </li>
        {% endfor %}
      </ol>
      {% endif %}
    </article>
  </div>
</div>
