---
layout: default
---
<div class="principle-page">
  <div class="container">
    <a href="{{ '/' | relative_url }}" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Manifesto
    </a>
    <article class="principle-content">
      {{ content }}
    </article>
  </div>
</div>
<script>
  // Assign stable IDs to ordered-list items so search results can deep-link
  // to a specific example via #example-N anchors. Only the first <ol> on the
  // page is annotated, mirroring the search-index generator.
  (function () {
    var firstList = document.querySelector(".principle-content ol");
    if (!firstList) return;
    var items = firstList.children;
    var n = 0;
    for (var j = 0; j < items.length; j++) {
      if (items[j].tagName !== "LI") continue;
      n += 1;
      if (!items[j].id) items[j].id = "example-" + n;
    }
  })();
</script>
